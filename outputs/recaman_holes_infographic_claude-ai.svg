<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" width="100%" role="img" aria-label="The integers Recaman never reaches (Claude.ai version)" preserveAspectRatio="xMidYMid meet" class="rch"><style>.rch{--rc-surface:#fcfcfb;--rc-plane:#f9f9f7;--rc-ink:#0b0b0b;--rc-ink2:#52514e;--rc-muted:#898781;--rc-grid:#e1e0d9;--rc-axis:#c3c2b7;--rc-primary:#2a78d6;--rc-accent:#eb6834;--rc-ring:rgba(11,11,11,0.10);font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;}@media (prefers-color-scheme: dark){.rch{--rc-surface:#1a1a19;--rc-plane:#0d0d0d;--rc-ink:#ffffff;--rc-ink2:#c3c2b7;--rc-muted:#898781;--rc-grid:#2c2c2a;--rc-axis:#383835;--rc-primary:#3987e5;--rc-accent:#d95926;--rc-ring:rgba(255,255,255,0.10);}}.rch .plane{fill:var(--rc-surface);}.rch .card{fill:var(--rc-plane);stroke:var(--rc-ring);stroke-width:1;}.rch text{fill:var(--rc-ink2);}.rch .h1{fill:var(--rc-ink);font-size:38px;font-weight:700;letter-spacing:-0.5px;}.rch .h2{fill:var(--rc-ink2);font-size:16px;}.rch .kicker{fill:var(--rc-muted);font-size:11px;font-weight:700;letter-spacing:1.5px;}.rch .title{fill:var(--rc-ink);font-size:16px;font-weight:600;}.rch .body{fill:var(--rc-ink2);font-size:13.5px;}.rch .small{fill:var(--rc-muted);font-size:12px;}.rch .tick{fill:var(--rc-muted);font-size:11px;font-variant-numeric:tabular-nums;}.rch .hero{fill:var(--rc-ink);font-size:42px;font-weight:700;letter-spacing:-1.2px;}.rch .num{fill:var(--rc-ink);font-size:14px;font-variant-numeric:tabular-nums;}.rch .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:13px;fill:var(--rc-ink);}.rch .grid{stroke:var(--rc-grid);stroke-width:1;fill:none;}.rch .axis{stroke:var(--rc-axis);stroke-width:1;fill:none;}.rch .stamp{fill:var(--rc-muted);font-size:10px;font-weight:700;letter-spacing:1.4px;}.rch .stamp-box{fill:none;stroke:var(--rc-axis);stroke-width:1;}</style><title>The integers Recaman never reaches (Claude.ai version)</title><rect class="plane" x="0" y="0" width="1200" height="1010"/><text x="40" y="52" class="kicker" text-anchor="start">RECAMÁN OBSTRUCTIONS · THE HOLE CATALOGUE</text><text x="40" y="92" class="h1" text-anchor="start">The integers Recamán never reaches</text><text x="40" y="120" class="h2" text-anchor="start">1,277,399 certified absolute holes between 930,058 and 4,293,242,951.</text><rect class="stamp-box" x="1028" y="42" width="132" height="20" rx="10"/><text x="1094" y="56" class="stamp" text-anchor="middle">CLAUDE.AI VERSION</text><line class="axis" x1="40" y1="140" x2="1160" y2="140"/><rect class="card" x="36" y="158" width="552" height="344" rx="10"/><text x="60" y="190" class="kicker" text-anchor="start">1 · WHAT A HOLE IS</text><text x="60" y="212" class="title" text-anchor="start">A value the sequence never lands on</text><text x="60" y="244" class="mono" text-anchor="start" xml:space="preserve">a(0) = 0</text><text x="60" y="265" class="mono" text-anchor="start" xml:space="preserve">a(n) = a(n−1) − n    if positive and unvisited</text><text x="60" y="286" class="mono" text-anchor="start" xml:space="preserve">a(n) = a(n−1) + n    otherwise</text><text x="60" y="326" class="small" text-anchor="start">The sequence hops backward when it can and forward when it</text><text x="60" y="343" class="small" text-anchor="start">cannot. An integer it never lands on — at any step, ever — is</text><text x="60" y="360" class="small" text-anchor="start">an absolute hole. Nothing in the range drawn below is one:</text><text x="60" y="377" class="small" text-anchor="start">the smallest hole in this catalogue is 930,058.</text><g transform="translate(56,388)"><line class="axis" x1="14" y1="35" x2="498" y2="35"/><path d="M 14 35 A 3.84 1.12 0 0 1 21.68 35" fill="none" stroke="var(--rc-accent)" stroke-width="1.7" opacity="0.92"/><path d="M 21.68 35 A 7.68 2.25 0 0 1 37.05 35" fill="none" stroke="var(--rc-accent)" stroke-width="1.7" opacity="0.92"/><path d="M 37.05 35 A 11.52 3.37 0 0 1 60.1 35" fill="none" stroke="var(--rc-accent)" stroke-width="1.7" opacity="0.92"/><path d="M 29.37 35 A 15.37 4.5 0 0 0 60.1 35" fill="none" stroke="var(--rc-primary)" stroke-width="1.7" opacity="0.92"/><path d="M 29.37 35 A 19.21 5.62 0 0 1 67.78 35" fill="none" stroke="var(--rc-accent)" stroke-width="1.7" opacity="0.92"/><path d="M 67.78 35 A 23.05 6.75 0 0 1 113.87 35" fill="none" stroke="var(--rc-accent)" stroke-width="1.7" opacity="0.92"/><path d="M 113.87 35 A 26.89 7.88 0 0 1 167.65 35" fill="none" stroke="var(--rc-accent)" stroke-width="1.7" opacity="0.92"/><path d="M 106.19 35 A 30.73 9 0 0 0 167.65 35" fill="none" stroke="var(--rc-primary)" stroke-width="1.7" opacity="0.92"/><path d="M 106.19 35 A 34.57 10.12 0 0 1 175.33 35" fill="none" stroke="var(--rc-accent)" stroke-width="1.7" opacity="0.92"/><path d="M 98.51 35 A 38.41 11.25 0 0 0 175.33 35" fill="none" stroke="var(--rc-primary)" stroke-width="1.7" opacity="0.92"/><path d="M 98.51 35 A 42.25 12.37 0 0 1 183.02 35" fill="none" stroke="var(--rc-accent)" stroke-width="1.7" opacity="0.92"/><path d="M 90.83 35 A 46.1 13.5 0 0 0 183.02 35" fill="none" stroke="var(--rc-primary)" stroke-width="1.7" opacity="0.92"/><path d="M 90.83 35 A 49.94 14.62 0 0 1 190.7 35" fill="none" stroke="var(--rc-accent)" stroke-width="1.7" opacity="0.92"/><path d="M 83.14 35 A 53.78 15.75 0 0 0 190.7 35" fill="none" stroke="var(--rc-primary)" stroke-width="1.7" opacity="0.92"/><path d="M 83.14 35 A 57.62 16.88 0 0 1 198.38 35" fill="none" stroke="var(--rc-accent)" stroke-width="1.7" opacity="0.92"/><path d="M 75.46 35 A 61.46 18 0 0 0 198.38 35" fill="none" stroke="var(--rc-primary)" stroke-width="1.7" opacity="0.92"/><path d="M 75.46 35 A 65.3 19.12 0 0 1 206.06 35" fill="none" stroke="var(--rc-accent)" stroke-width="1.7" opacity="0.92"/><path d="M 206.06 35 A 69.14 20.25 0 0 1 344.35 35" fill="none" stroke="var(--rc-accent)" stroke-width="1.7" opacity="0.92"/><path d="M 344.35 35 A 72.98 21.38 0 0 1 490.32 35" fill="none" stroke="var(--rc-accent)" stroke-width="1.7" opacity="0.92"/><path d="M 336.67 35 A 76.83 22.5 0 0 0 490.32 35" fill="none" stroke="var(--rc-primary)" stroke-width="1.7" opacity="0.92"/><path d="M 336.67 35 A 80.67 23.62 0 0 1 498 35" fill="none" stroke="var(--rc-accent)" stroke-width="1.7" opacity="0.92"/><path d="M 328.98 35 A 84.51 24.75 0 0 0 498 35" fill="none" stroke="var(--rc-primary)" stroke-width="1.7" opacity="0.92"/><path d="M 152.29 35 A 88.35 25.88 0 0 0 328.98 35" fill="none" stroke="var(--rc-primary)" stroke-width="1.7" opacity="0.92"/><path d="M 152.29 35 A 92.19 27 0 0 1 336.67 35" fill="none" stroke="var(--rc-accent)" stroke-width="1.7" opacity="0.92"/><circle cx="14" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="21.68" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="29.37" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="37.05" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="60.1" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="67.78" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="75.46" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="83.14" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="90.83" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="98.51" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="106.19" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="113.87" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="152.29" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="167.65" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="175.33" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="183.02" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="190.7" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="198.38" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="206.06" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="328.98" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="336.67" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="344.35" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="490.32" cy="35" r="2.2" fill="var(--rc-axis)"/><circle cx="498" cy="35" r="2.2" fill="var(--rc-axis)"/><rect x="14" y="95" width="14" height="4" rx="2" fill="var(--rc-primary)"/><text x="36" y="102" class="small" text-anchor="start">backward move  a(n−1) − n</text><rect x="249.52" y="95" width="14" height="4" rx="2" fill="var(--rc-accent)"/><text x="271.52" y="102" class="small" text-anchor="start">forward move  a(n−1) + n</text></g><rect class="card" x="612" y="158" width="552" height="344" rx="10"/><text x="636" y="190" class="kicker" text-anchor="start">2 · WHERE THEY SIT</text><text x="636" y="212" class="title" text-anchor="start">Missing integers by magnitude</text><text x="636" y="262" class="hero" text-anchor="start">0.0298%</text><text x="636" y="288" class="small" text-anchor="start">of the 4,292,312,894 integers in the covered span are</text><text x="636" y="305" class="small" text-anchor="start">missing — about one in 3,360. The catalogue is</text><text x="636" y="322" class="small" text-anchor="start">complete over that span, so every other value is reached.</text><g transform="translate(624,344)"><line class="grid" x1="62" y1="96" x2="494" y2="96"/><text x="52" y="100" class="tick" text-anchor="end">10</text><line class="grid" x1="62" y1="85.33" x2="494" y2="85.33"/><text x="52" y="89.33" class="tick" text-anchor="end">100</text><line class="grid" x1="62" y1="74.67" x2="494" y2="74.67"/><text x="52" y="78.67" class="tick" text-anchor="end">1k</text><line class="grid" x1="62" y1="64" x2="494" y2="64"/><text x="52" y="68" class="tick" text-anchor="end">10k</text><line class="grid" x1="62" y1="53.33" x2="494" y2="53.33"/><text x="52" y="57.33" class="tick" text-anchor="end">100k</text><line class="grid" x1="62" y1="42.67" x2="494" y2="42.67"/><text x="52" y="46.67" class="tick" text-anchor="end">1M</text><line class="grid" x1="62" y1="32" x2="494" y2="32"/><text x="52" y="36" class="tick" text-anchor="end">10M</text><line class="axis" x1="62" y1="96" x2="494" y2="96"/><polyline points="62,95.16 170,85.82 278,60.14 386,54.36 494,41.92" fill="none" stroke="var(--rc-primary)" stroke-width="2"/><circle cx="62" cy="95.16" r="4.5" fill="var(--rc-primary)" stroke="var(--rc-surface)" stroke-width="2"/><text x="62" y="114" class="tick" text-anchor="middle">10⁵</text><text x="72" y="86.16" class="num" text-anchor="start">12</text><circle cx="170" cy="85.82" r="4.5" fill="var(--rc-primary)" stroke="var(--rc-surface)" stroke-width="2"/><text x="170" y="114" class="tick" text-anchor="middle">10⁶</text><circle cx="278" cy="60.14" r="4.5" fill="var(--rc-primary)" stroke="var(--rc-surface)" stroke-width="2"/><text x="278" y="114" class="tick" text-anchor="middle">10⁷</text><circle cx="386" cy="54.36" r="4.5" fill="var(--rc-primary)" stroke="var(--rc-surface)" stroke-width="2"/><text x="386" y="114" class="tick" text-anchor="middle">10⁸</text><circle cx="494" cy="41.92" r="4.5" fill="var(--rc-primary)" stroke="var(--rc-surface)" stroke-width="2"/><text x="494" y="114" class="tick" text-anchor="middle">10⁹</text><text x="494" y="28.92" class="num" text-anchor="end">1,174,175</text><text x="62" y="136" class="small" text-anchor="start">band, by power of ten</text><text x="494" y="136" class="small" text-anchor="end">lowest band partly covered</text></g><rect class="card" x="36" y="522" width="1128" height="214" rx="10"/><text x="60" y="554" class="kicker" text-anchor="start">3 · THEY ARRIVE IN RUNS</text><text x="60" y="576" class="title" text-anchor="start">Almost all of the mass is in 104 events</text><text x="60" y="626" class="hero" text-anchor="start">97.2%</text><text x="60" y="652" class="small" text-anchor="start">of all missing integers fall inside the 104 runs of</text><text x="60" y="669" class="small" text-anchor="start">1,001 or more consecutive values, out of 3,102 events in total.</text><text x="60" y="686" class="small" text-anchor="start">The longest single run is 368,058 consecutive integers.</text><text x="560" y="566" class="kicker" text-anchor="start">RUN LENGTH</text><text x="826.8" y="566" class="kicker" text-anchor="end">EVENTS</text><text x="977.6" y="566" class="kicker" text-anchor="end">MISSING</text><text x="1128.4" y="566" class="kicker" text-anchor="end">SHARE</text><line class="axis" x1="560" y1="576" x2="1140" y2="576"/><text x="560" y="596" class="body" text-anchor="start" font-size="13">1</text><text x="826.8" y="596" class="num" text-anchor="end">2,535</text><text x="977.6" y="596" class="num" text-anchor="end">2,535</text><text x="1128.4" y="596" class="num" text-anchor="end">0.2%</text><text x="560" y="618" class="body" text-anchor="start" font-size="13">2</text><text x="826.8" y="618" class="num" text-anchor="end">374</text><text x="977.6" y="618" class="num" text-anchor="end">748</text><text x="1128.4" y="618" class="num" text-anchor="end">0.1%</text><text x="560" y="640" class="body" text-anchor="start" font-size="13">3–10</text><text x="826.8" y="640" class="num" text-anchor="end">10</text><text x="977.6" y="640" class="num" text-anchor="end">61</text><text x="1128.4" y="640" class="num" text-anchor="end">0.0%</text><text x="560" y="662" class="body" text-anchor="start" font-size="13">11–100</text><text x="826.8" y="662" class="num" text-anchor="end">15</text><text x="977.6" y="662" class="num" text-anchor="end">743</text><text x="1128.4" y="662" class="num" text-anchor="end">0.1%</text><text x="560" y="684" class="body" text-anchor="start" font-size="13">101–1,000</text><text x="826.8" y="684" class="num" text-anchor="end">64</text><text x="977.6" y="684" class="num" text-anchor="end">31,403</text><text x="1128.4" y="684" class="num" text-anchor="end">2.5%</text><text x="560" y="706" class="body" text-anchor="start" font-size="13">1,001+</text><text x="826.8" y="706" class="num" text-anchor="end">104</text><text x="977.6" y="706" class="num" text-anchor="end" font-weight="700">1,241,909</text><text x="1128.4" y="706" class="num" text-anchor="end" font-weight="700">97.2%</text><rect class="card" x="36" y="756" width="744" height="202" rx="10"/><text x="60" y="788" class="kicker" text-anchor="start">4 · WHAT IS PREDICTABLE</text><text x="60" y="810" class="title" text-anchor="start">Measured separation from matched controls</text><rect x="408" y="781" width="14" height="4" rx="2" fill="var(--rc-primary)"/><text x="430" y="788" class="small" text-anchor="start">leakage-reduced task</text><rect x="596" y="781" width="14" height="4" rx="2" fill="var(--rc-accent)"/><text x="618" y="788" class="small" text-anchor="start">easier task</text><g transform="translate(48,800)"><line class="grid" x1="264" y1="16" x2="264" y2="108"/><text x="264" y="124" class="tick" text-anchor="middle">0.5</text><line class="grid" x1="342.4" y1="16" x2="342.4" y2="108"/><text x="342.4" y="124" class="tick" text-anchor="middle">0.6</text><line class="grid" x1="420.8" y1="16" x2="420.8" y2="108"/><text x="420.8" y="124" class="tick" text-anchor="middle">0.7</text><line class="grid" x1="499.2" y1="16" x2="499.2" y2="108"/><text x="499.2" y="124" class="tick" text-anchor="middle">0.8</text><line class="grid" x1="577.6" y1="16" x2="577.6" y2="108"/><text x="577.6" y="124" class="tick" text-anchor="middle">0.9</text><line class="grid" x1="656" y1="16" x2="656" y2="108"/><text x="656" y="124" class="tick" text-anchor="middle">1.0</text><line class="axis" x1="264" y1="16" x2="264" y2="108" stroke-width="1.5"/><text x="264" y="140" class="small" text-anchor="middle">chance</text><line x1="264" y1="23.67" x2="392.02" y2="23.67" stroke="var(--rc-primary)" stroke-width="2" stroke-linecap="round"/><circle cx="392.02" cy="23.67" r="4.5" fill="var(--rc-primary)" stroke="var(--rc-surface)" stroke-width="2"/><text x="250" y="27.67" class="body" text-anchor="end" font-size="13">random-matrix · RF cross-validation</text><text x="404.02" y="27.67" class="num" text-anchor="start">0.6633</text><line x1="264" y1="39" x2="341.97" y2="39" stroke="var(--rc-primary)" stroke-width="2" stroke-linecap="round"/><circle cx="341.97" cy="39" r="4.5" fill="var(--rc-primary)" stroke="var(--rc-surface)" stroke-width="2"/><text x="250" y="43" class="body" text-anchor="end" font-size="13">random-matrix · best linear code</text><text x="353.97" y="43" class="num" text-anchor="start">0.5994</text><line x1="264" y1="54.33" x2="466.77" y2="54.33" stroke="var(--rc-primary)" stroke-width="2" stroke-linecap="round"/><circle cx="466.77" cy="54.33" r="4.5" fill="var(--rc-primary)" stroke="var(--rc-surface)" stroke-width="2"/><text x="250" y="58.33" class="body" text-anchor="end" font-size="13">Version C D · gap dynamics</text><text x="478.77" y="58.33" class="num" text-anchor="start">0.7586</text><line x1="264" y1="69.67" x2="652.97" y2="69.67" stroke="var(--rc-accent)" stroke-width="2" stroke-linecap="round"/><circle cx="652.97" cy="69.67" r="4.5" fill="var(--rc-accent)" stroke="var(--rc-surface)" stroke-width="2"/><text x="250" y="73.67" class="body" text-anchor="end" font-size="13">Version C A · singleton starts</text><text x="664.97" y="73.67" class="num" text-anchor="start">0.9961</text><line x1="264" y1="85" x2="653.17" y2="85" stroke="var(--rc-accent)" stroke-width="2" stroke-linecap="round"/><circle cx="653.17" cy="85" r="4.5" fill="var(--rc-accent)" stroke="var(--rc-surface)" stroke-width="2"/><text x="250" y="89" class="body" text-anchor="end" font-size="13">Version C B · range starts</text><text x="665.17" y="89" class="num" text-anchor="start">0.9964</text><line x1="264" y1="100.33" x2="651.62" y2="100.33" stroke="var(--rc-accent)" stroke-width="2" stroke-linecap="round"/><circle cx="651.62" cy="100.33" r="4.5" fill="var(--rc-accent)" stroke="var(--rc-surface)" stroke-width="2"/><text x="250" y="104.33" class="body" text-anchor="end" font-size="13">Version C C · range ends</text><text x="663.62" y="104.33" class="num" text-anchor="start">0.9944</text><text x="460" y="140" class="small" text-anchor="middle">mean AUC</text></g><rect class="card" x="804" y="756" width="360" height="202" rx="10"/><text x="828" y="788" class="kicker" text-anchor="start">READ THIS BEFORE CITING IT</text><text x="828" y="810" class="title" text-anchor="start">What it does not claim</text><text x="828" y="824" class="small" text-anchor="start">No model here decides whether a given integer</text><text x="828" y="841" class="small" text-anchor="start">is a hole. The honest scores sit between 0.60</text><text x="828" y="858" class="small" text-anchor="start">and 0.76 — real separation, far from a test.</text><text x="828" y="875" class="small" text-anchor="start"></text><text x="828" y="892" class="small" text-anchor="start">The three tasks above 0.99 ask an easier</text><text x="828" y="909" class="small" text-anchor="start">question and are kept only as a ceiling.</text><text x="828" y="926" class="small" text-anchor="start"></text><text x="828" y="943" class="small" text-anchor="start">Outside the covered span the catalogue is</text><text x="828" y="960" class="small" text-anchor="start">silent, and so is everything shown here.</text><line class="axis" x1="40" y1="978" x2="1160" y2="978"/><text x="40" y="998" class="small" text-anchor="start">Hole catalogue certified by Benjamin Chaffin; scores measured in this repository.</text><text x="1160" y="998" class="small" text-anchor="end">Claude.ai version · source: obstructions.txt</text></svg>