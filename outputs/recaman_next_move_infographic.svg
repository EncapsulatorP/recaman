34" stroke="var(--rc-blocked)" stroke-width="2.6" stroke-linecap="round"/><line class="axis" x1="1027.13" y1="72" x2="1027.13" y2="34"/><path d="M 536.7 92 L 536.7 82 L 618.43 82 L 618.43 92" fill="none" stroke="var(--rc-ink)" stroke-width="1.3" opacity="0.6"/><text x="577.57" y="107" class="small" text-anchor="middle" font-weight="600">phase slip · b(n) = b(n−1)</text><text x="128" y="104" class="tick" text-anchor="start">n = 51,686</text><text x="1068" y="104" class="tick" text-anchor="end">n = 51,708</text></g><rect class="card" x="36" y="726" width="700" height="232" rx="10"/><text x="60" y="758" class="kicker" text-anchor="start">4 · WHY THIS IS A SNAPSHOT</text><text x="60" y="780" class="title" text-anchor="start">The slip rate is still falling</text><g transform="translate(48,790)"><line class="grid" x1="60" y1="106" x2="540" y2="106"/><text x="50" y="110" class="tick" text-anchor="end">0.1%</text><line class="grid" x1="60" y1="62" x2="540" y2="62"/><text x="50" y="66" class="tick" text-anchor="end">1%</text><line class="grid" x1="60" y1="18" x2="540" y2="18"/><text x="50" y="22" class="tick" text-anchor="end">10%</text><line class="grid" x1="60" y1="18" x2="60" y2="106"/><text x="60" y="124" class="tick" text-anchor="middle">10⁴</text><line class="grid" x1="220" y1="18" x2="220" y2="106"/><text x="220" y="124" class="tick" text-anchor="middle">10⁵</text><line class="grid" x1="380" y1="18" x2="380" y2="106"/><text x="380" y="124" class="tick" text-anchor="middle">10⁶</text><line class="grid" x1="540" y1="18" x2="540" y2="106"/><text x="540" y="124" class="tick" text-anchor="middle">10⁷</text><line class="axis" x1="60" y1="106" x2="540" y2="106"/><polyline points="60,43.77 540,104.14" fill="none" stroke="var(--rc-muted)" stroke-width="1.1" opacity="0.85"/><text x="68" y="96" class="small" text-anchor="start">power-law guide · slope -0.46</text><polyline points="60,45.51 220,61.83 380,82.47 491.84,99.63 540,104.46" fill="none" stroke="var(--rc-free)" stroke-width="2"/><circle cx="60" cy="45.51" r="4.5" fill="var(--rc-free)" stroke="var(--rc-surface)" stroke-width="2"/><circle cx="220" cy="61.83" r="4.5" fill="var(--rc-free)" stroke="var(--rc-surface)" stroke-width="2"/><circle cx="380" cy="82.47" r="4.5" fill="var(--rc-free)" stroke="var(--rc-surface)" stroke-width="2"/><circle cx="491.84" cy="99.63" r="4.5" fill="var(--rc-free)" stroke="var(--rc-surface)" stroke-width="2"/><circle cx="540" cy="104.46" r="4.5" fill="var(--rc-free)" stroke="var(--rc-surface)" stroke-width="2"/><line class="axis" x1="548" y1="104.46" x2="562" y2="104.46"/><text x="568" y="103.46" class="num" text-anchor="start">0.1084%</text><text x="568" y="119.46" class="small" text-anchor="start">at N = 10⁷</text><text x="300" y="146" class="small" text-anchor="middle">measurement horizon N</text></g><rect class="card" x="760" y="726" width="404" height="232" rx="10"/><text x="784" y="758" class="kicker" text-anchor="start">READ THIS BEFORE CITING IT</text><text x="784" y="780" class="title" text-anchor="start">What it does not claim</text><text x="784" y="812" class="small" text-anchor="start">The rate fell by a factor of 22 between</text><text x="784" y="829" class="small" text-anchor="start">N = 10⁴ and N = 10⁷ and shows no sign of</text><text x="784" y="846" class="small" text-anchor="start">settling, so no limiting value is claimed.</text><text x="784" y="863" class="small" text-anchor="start"></text><text x="784" y="880" class="small" text-anchor="start">Observed: 10,839 slips across</text><text x="784" y="897" class="small" text-anchor="start">9,999,999 consecutive pairs — a mean run</text><text x="784" y="914" class="small" text-anchor="start">of 415 clean alternations between defects.</text><line class="axis" x1="40" y1="978" x2="1160" y2="978"/><text x="40" y="998" class="small" text-anchor="start">Predicts the next obstruction bit only — not where the rare slips land, and not which integers stay permanently missing.</text><text x="1160" y="998" class="small" text-anchor="end">source: outputs/recaman_wheel_results.json</text></svg>