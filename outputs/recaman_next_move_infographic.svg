<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" width="100%" role="img" aria-label="Predicting Recaman&#x27;s next move" preserveAspectRatio="xMidYMid meet" class="rc"><style>.rc{--rc-surface:#fcfcfb;--rc-plane:#f9f9f7;--rc-ink:#0b0b0b;--rc-ink2:#52514e;--rc-muted:#898781;--rc-grid:#e1e0d9;--rc-axis:#c3c2b7;--rc-free:#2a78d6;--rc-blocked:#eb6834;--rc-ring:rgba(11,11,11,0.10);font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;}@media (prefers-color-scheme: dark){.rc{--rc-surface:#1a1a19;--rc-plane:#0d0d0d;--rc-ink:#ffffff;--rc-ink2:#c3c2b7;--rc-muted:#898781;--rc-grid:#2c2c2a;--rc-axis:#383835;--rc-free:#3987e5;--rc-blocked:#d95926;--rc-ring:rgba(255,255,255,0.10);}}.rc .plane{fill:var(--rc-surface);}.rc .card{fill:var(--rc-plane);stroke:var(--rc-ring);stroke-width:1;}.rc text{fill:var(--rc-ink2);}.rc .h1{fill:var(--rc-ink);font-size:38px;font-weight:700;letter-spacing:-0.5px;}.rc .h2{fill:var(--rc-ink2);font-size:16px;}.rc .kicker{fill:var(--rc-muted);font-size:11px;font-weight:700;letter-spacing:1.5px;}.rc .title{fill:var(--rc-ink);font-size:16px;font-weight:600;}.rc .body{fill:var(--rc-ink2);font-size:13.5px;}.rc .small{fill:var(--rc-muted);font-size:12px;}.rc .tick{fill:var(--rc-muted);font-size:11px;font-variant-numeric:tabular-nums;}.rc .hero{fill:var(--rc-ink);font-size:44px;font-weight:700;letter-spacing:-1.2px;}.rc .num{fill:var(--rc-ink);font-size:14px;font-variant-numeric:tabular-nums;}.rc .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:13px;fill:var(--rc-ink);}.rc .grid{stroke:var(--rc-grid);stroke-width:1;fill:none;}.rc .axis{stroke:var(--rc-axis);stroke-width:1;fill:none;}</style><title>Predicting Recaman&#x27;s next move</title><rect class="plane" x="0" y="0" width="1200" height="1010"/><text x="40" y="52" class="kicker" text-anchor="start">RECAMÁN OBSTRUCTIONS · PROCESS-SIDE RESULT</text><text x="40" y="92" class="h1" text-anchor="start">Predicting Recamán&#x27;s next move</text><text x="40" y="120" class="h2" text-anchor="start">The previous obstruction bit calls the next one 99.89% of the time, measured over N = 10,000,000 steps.</text><line class="axis" x1="40" y1="140" x2="1160" y2="140"/><rect class="card" x="36" y="158" width="552" height="344" rx="10"/><text x="60" y="190" class="kicker" text-anchor="start">1 · THE RULE</text><text x="60" y="212" class="title" text-anchor="start">Try backward first, else go forward</text><text x="60" y="248" class="mono" text-anchor="start" xml:space="preserve">a(0) = 0</text><text x="60" y="269" class="mono" text-anchor="start" xml:space="preserve">a(n) = a(n−1) − n    if positive and unvisited    →  b(n) = 0</text><text x="60" y="290" class="mono" text-anchor="start" xml:space="preserve">a(n) = a(n−1) + n    otherwise                    →  b(n) = 1</text><text x="60" y="322" class="small" text-anchor="start">The first 24 steps drawn as arcs, over values 0 – 63:</text><g transform="translate(56,330)"><line class="axis" x1="14" y1="62" x2="498" y2="62"/><path d="M 14 62 A 3.84 2.25 0 0 1 21.68 62" fill="none" stroke="var(--rc-blocked)" stroke-width="1.7" opacity="0.92"/><path d="M 21.68 62 A 7.68 4.5 0 0 1 37.05 62" fill="none" stroke="var(--rc-blocked)" stroke-width="1.7" opacity="0.92"/><path d="M 37.05 62 A 11.52 6.75 0 0 1 60.1 62" fill="none" stroke="var(--rc-blocked)" stroke-width="1.7" opacity="0.92"/><path d="M 29.37 62 A 15.37 9 0 0 0 60.1 62" fill="none" stroke="var(--rc-free)" stroke-width="1.7" opacity="0.92"/><path d="M 29.37 62 A 19.21 11.25 0 0 1 67.78 62" fill="none" stroke="var(--rc-blocked)" stroke-width="1.7" opacity="0.92"/><path d="M 67.78 62 A 23.05 13.5 0 0 1 113.87 62" fill="none" stroke="var(--rc-blocked)" stroke-width="1.7" opacity="0.92"/><path d="M 113.87 62 A 26.89 15.75 0 0 1 167.65 62" fill="none" stroke="var(--rc-blocked)" stroke-width="1.7" opacity="0.92"/><path d="M 106.19 62 A 30.73 18 0 0 0 167.65 62" fill="none" stroke="var(--rc-free)" stroke-width="1.7" opacity="0.