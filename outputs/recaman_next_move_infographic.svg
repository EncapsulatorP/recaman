ll="var(--rc-axis)"/><circle cx="21.68" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="29.37" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="37.05" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="60.1" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="67.78" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="75.46" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="83.14" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="90.83" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="98.51" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="106.19" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="113.87" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="152.29" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="167.65" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="175.33" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="183.02" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="190.7" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="198.38" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="206.06" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="328.98" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="336.67" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="344.35" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="490.32" cy="62" r="2.2" fill="var(--rc-axis)"/><circle cx="498" cy="62" r="2.2" fill="var(--rc-axis)"/><rect x="14" y="149" width="14" height="4" rx="2" fill="var(--rc-free)"/><text x="36" y="156" class="small" text-anchor="start">DOWN / FREE · b = 0 · backward</text><rect x="249.52" y="149" width="14" height="4" rx="2" fill="var(--rc-blocked)"/><text x="271.52" y="156" class="small" text-anchor="start">UP / BLOCKED · b = 1 · forward</text></g><rect class="card" x="612" y="158" width="552" height="344" rx="10"/><text x="636" y="190" class="kicker" text-anchor="start">2 · THE MEASURED TRANSITION</text><text x="636" y="212" class="title" text-anchor="start">The previous bit is the state</text><text x="636" y="272" class="hero" text-anchor="start">99.89%</text><text x="636" y="300" class="small" text-anchor="start">of steps that follow a free backward move are blocked,</text><text x="636" y="318" class="small" text-anchor="start">against a 50% coin-flip baseline.</text><text x="636" y="356" class="kicker" text-anchor="start">PREVIOUS BIT</text><text x="928.32" y="356" class="kicker" text-anchor="middle">NEXT b = 0</text><text x="1074.48" y="356" class="kicker" text-anchor="middle">NEXT b = 1</text><line class="axis" x1="636" y1="368" x2="1140" y2="368"/><rect x="636" y="385" width="4" height="12" rx="2" fill="var(--rc-free)"/><text x="650" y="394" class="body" text-anchor="start">b = 0   DOWN / FREE</text><text x="928.32" y="394" class="num" text-anchor="middle" opacity="0.5">0.1081%</text><text x="1074.48" y="394" class="num" text-anchor="middle" font-weight="700">99.8919%</text><rect x="636" y="417" width="4" height="12" rx="2" fill="var(--rc-blocked)"/><text x="650" y="426" class="body" text-anchor="start">b = 1   UP / BLOCKED</text><text x="928.32" y="426" class="num" text-anchor="middle" font-weight="700">99.8913%</text><text x="1074.48" y="426" class="num" text-anchor="middle" opacity="0.5">0.1087%</text><text x="636" y="470" class="small" text-anchor="start">The classic Θ₃ wheel is falsified on the same run: its two</text><text x="636" y="487" class="small" text-anchor="start">states differ by only 1.1e-05.</text><rect class="card" x="36" y="522" width="1128" height="184" rx="10"/><text x="60" y="554" class="kicker" text-anchor="start">3 · WHAT THE ERRORS LOOK LIKE</text><text x="60" y="576" class="title" text-anchor="start">One real phase slip in the bit stream near n = 51,697</text><g transform="translate(56,584)"><line class="grid" x1="128" y1="34" x2="1068" y2="34"/><text x="110" y="31" class="small" text-anchor="end">UP / BLOCKED</text><text x="110" y="47" class="num" text-anchor="end">b = 1</text><rect x="119" y="26" width="4" height="16" rx="2" fill="var(--rc-blocked)"/><line cla