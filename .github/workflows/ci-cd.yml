name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-ci:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          run_all.py scripts apps/space apps/claude_ai_holes apps/comparison tests

      - name: Run unit tests
        run: python -m pytest -q --ignore=tests/test_comparison_space.py

      - name: Verify generated app measurements are current
        run: python scripts/build_space_measurements.py --check

      - name: Verify obstruction and tower app data is current
        run: python scripts/build_obstruction_tower_space.py --check

      - name: Verify the infographic matches the saved run
        run: python scripts/make_infographic.py --check

      - name: Verify obstruction app files are current
        run: python scripts/sync_claude_ai_holes.py --check

      - name: Verify obstruction infographic matches the catalogue
        run: python scripts/make_claude_ai_holes_infographic.py --check

      - name: Verify deep-obstruction frequency result is current
        run: python scripts/test_deep_obstruction_frequency.py --check

      - name: Verify exact hole-mechanism trace is current
        run: python scripts/analyze_hole_mechanisms.py --check

      - name: Validate experiment runner
        run: python run_all.py --dry-run

      - name: Smoke-test density analysis
        run: >-
          python scripts/densities.py
          --steps 1000 10000
          --value-bands 5
          --band-report-count 1

      - name: Smoke-test forward validation
        run: >-
          python scripts/321_210_version_c.py
          --input-file obstructions.txt
          --datasets D
          --blocked-folds 2
          --n-estimators 10
          --save-json "${RUNNER_TEMP}/version-c-smoke.json"

      - name: Smoke-test phase-space rendering
        env:
          MPLBACKEND: Agg
        run: >-
          python scripts/recaman_phase_space_3d.py
          --steps 100
          --mode delay
          --save "${RUNNER_TEMP}/phase-space-smoke.png"

  space-smoke:
    name: Next-move app smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/space/requirements.txt

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/space/requirements.txt

      - name: Check the pinned SDK matches the app metadata
        run: >-
          python -c
          "import pathlib, re, gradio;
          card = pathlib.Path('apps/space/README.md').read_text(encoding='utf-8');
          pinned = re.search(r'^sdk_version:\s*(\S+)$', card, re.M).group(1);
          assert pinned == gradio.__version__, f'README pins {pinned}, installed {gradio.__version__}'"

      - name: Import the application and exercise its endpoints
        run: >-
          python -c
          "import sys; sys.path.insert(0, 'apps/space'); import app;
          assert app.demo is not None;
          card, payload = app.predict(app.DEFAULT_CHOICE);
          assert payload['predicted_bit'] in (0, 1);
          arc, ribbon, report = app.simulate(5000, 24);
          assert arc.startswith('<svg') and ribbon.startswith('<svg') and report;
          assert app.simulate_bits(64)['steps'] == 64;
          arena_svg, arena_report, arena = app.inspect_model_arena(20000, 3, 210);
          assert arena_svg.startswith('<svg') and arena_report and arena['test_steps'] > 0;
          tower_svg, tower_report, tower = app.inspect_signed_tower(2000);
          assert tower_svg.startswith('<svg') and tower['identity_verified'] and tower_report;
          power_svg, power_report, power = app.inspect_power_probe(3, 210, 64);
          assert power_svg.startswith('<svg') and power_report and power['layers'] == 64;
          evolution_svg, evolution_report, evolution = app.inspect_evolution(2000, 64, 3, 210);
          assert evolution_svg.startswith('<svg') and evolution_report and evolution['end_step'] == 2064;
          rank_svg, rank_report, rank = app.inspect_rank_tower(7);
          assert rank_svg.startswith('<svg') and rank['real_rank'] == 221 and rank_report"

  claude-ai-holes-smoke:
    name: Obstruction compression app smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/claude_ai_holes/requirements.txt

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/claude_ai_holes/requirements.txt

      - name: Check the pinned SDK matches the app metadata
        run: >-
          python -c
          "import pathlib, re, gradio;
          card = pathlib.Path('apps/claude_ai_holes/README.md').read_text(encoding='utf-8');
          pinned = re.search(r'^sdk_version:\s*(\S+)$', card, re.M).group(1);
          assert pinned == gradio.__version__, f'README pins {pinned}, installed {gradio.__version__}'"

      - name: Import the application and exercise it
        run: >-
          python -c
          "import sys; sys.path.insert(0, 'apps/claude_ai_holes'); import app;
          assert app.demo is not None;
          assert app.CATALOGUE.event_count == 3103;
          strip, report = app.explore('full span', 0);
          assert strip.startswith('<svg') and '1,277,400' in report;
          catalogue_svg, process_svg, compression_report, compression = app.compression_experiment(20000);
          assert catalogue_svg.startswith('<svg') and process_svg.startswith('<svg');
          assert compression['catalogue']['event_round_trip'] and compression_report;
          assert '1,277,400' in app.overview()"

  comparison-space-smoke:
    name: Independent comparison app smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/comparison/requirements.txt

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/comparison/requirements.txt pytest

      - name: Check the pinned SDK matches the app metadata
        run: >-
          python -c
          "import pathlib, re, gradio;
          card = pathlib.Path('apps/comparison/README.md').read_text(encoding='utf-8');
          pinned = re.search(r'^sdk_version:\s*(\S+)$', card, re.M).group(1);
          assert pinned == gradio.__version__, f'README pins {pinned}, installed {gradio.__version__}'"

      - name: Validate the comparison contract and calculations
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          python scripts/test_deep_obstruction_frequency.py --check
          python scripts/analyze_hole_mechanisms.py --check
          python scripts/build_comparison_tables.py --check
          python -m pytest -q tests/test_comparison_space.py tests/test_space_cards.py
